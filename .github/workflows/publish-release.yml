name: Publish Alpha Release

on:
  push:
    branches: [ KMP ]
  workflow_dispatch:

jobs:
  publish:
    name: Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts from build run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          mkdir -p release-assets
          gh run download 43668221186 --repo "$GITHUB_REPOSITORY" --dir release-assets
          echo "=== Downloaded Artifacts ==="
          ls -lR release-assets

      - name: Collect files and publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          mkdir -p release-files
          find release-assets/ -type f -name "*.apk" -exec cp -v {} release-files/ \;
          find release-assets/ -type f -name "*.zip" -exec cp -v {} release-files/ \;
          echo "=== Release Files ==="
          ls -lh release-files/

          TAG="v14.0.0-alpha"
          gh release delete "$TAG" --yes --repo "$GITHUB_REPOSITORY" 2>/dev/null || true

          gh release create "$TAG" release-files/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "MetroFuse $TAG (KMP)" \
            --notes "### MetroFuse Alpha (KMP Build)

Compiled via GitHub Actions from the \`KMP\` branch.

#### Included Packages:
- **Android:** Release & Debug APKs
- **Windows:** Portable package (.zip) for x64 Windows

*Note: This is an Alpha pre-release build.*" \
            --prerelease
