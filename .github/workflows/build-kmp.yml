name: Build KMP (Android & Windows)

on:
  push:
    branches: [ KMP ]
  workflow_dispatch:

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Gradle
        run: |
          sed -i '/^org.gradle.java.home=/d' gradle.properties
          chmod +x ./gradlew

      - name: Build Android Debug APK
        run: ./gradlew :androidApp:assembleDebug --no-daemon --no-configuration-cache

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: metrofuse-android-apk
          path: androidApp/build/outputs/apk/debug/*.apk

  windows:
    name: Build Windows App
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: metro-wv2-helper/global.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Python dependencies & generate icons
        shell: pwsh
        run: |
          python -m pip install Pillow
          python scripts/gen_icons.py

      - name: Build Windows login helper
        shell: pwsh
        working-directory: metro-wv2-helper
        run: |
          $output = "../desktopApp/src/desktopMain/resources/windows"
          dotnet publish "metro-wv2-helper.csproj" --configuration Release --runtime win-x64 --self-contained true --output $output -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false -p:PublishReadyToRun=true

      - name: Prepare Gradle
        shell: pwsh
        run: |
          (Get-Content gradle.properties) | Where-Object { $_ -notmatch '^org.gradle.java.home=' } | Set-Content gradle.properties

      - name: Build Windows Release
        shell: bash
        run: |
          ./gradlew :desktopApp:assembleWindowsRelease -Pmetrolist.verifyPackaging=false -Pmetrolist.desktop.arch=x86_64 --no-daemon --no-configuration-cache

      - name: Upload Windows Build
        uses: actions/upload-artifact@v4
        with:
          name: metrofuse-windows-desktop
          path: dist/*.zip
